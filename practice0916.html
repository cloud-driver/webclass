<! DOCTYPE html>
<html>
    <head> 
        <style> strong{
            font-weight: bold; 
            font-size: large; 
            font-style: italic;
            color: blue;
            background-color: yellow;
        }
        em{
            font-style: italic;
            color: red;
        }
        </style> 
    </head> 
    <body>
        <p>A strong element is displayed like this:</p>
        <strong>Some important text</strong>
        <p>Change the default <acronym title="Cascading Style Sheets">CSS</acronym> settings to see the effect.</p>
        <p>An em element is displayed like this:</p>
        <em>Some emphasized text</em>   
    </body>
</html>
